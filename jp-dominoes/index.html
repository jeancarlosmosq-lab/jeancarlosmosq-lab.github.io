<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JP Dominoes Scorekeeper</title>
<meta name="description" content="Keep score at the domino table. Free on iPhone, iPad and Android.">
<!-- The card messaging apps show for the shared link (they read these, not the script). -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://jeancarlosmosq-lab.github.io/jp-dominoes/">
<meta property="og:title" content="JP Dominoes Scorekeeper">
<meta property="og:description" content="Keep score at the domino table. Free on iPhone, iPad and Android.">
<meta property="og:image" content="https://jeancarlosmosq-lab.github.io/jp-dominoes/card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script>
  // One link for everyone: whoever opens it is sent to their own store.
  // iPadOS Safari reports itself as a Mac, so a touch "Mac" is an iPad.
  (function () {
    var APP_STORE = "https://apps.apple.com/app/id6817531522";
    var PLAY = "https://play.google.com/store/apps/details?id=com.bayonne.dominoscorekeeper";
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    if (ios) location.replace(APP_STORE);
    else if (android) location.replace(PLAY);
  })();
</script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(110% 55% at 50% -12%, rgba(233,185,73,0.18), transparent 62%),
                linear-gradient(180deg, #15100A 0%, #0B0907 55%, #090705 100%);
    color: #F4EBDA; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: min(26rem, 100%); padding: 2.5rem 1.25rem; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  h1 { margin: 1rem 0 0.25rem; font-size: 1.5rem; color: #E8C15A; }
  p { margin: 0 0 1.75rem; color: #C9BBA0; }
  a.store {
    display: block; margin: 0.75rem 0; padding: 0.95rem 1rem; border-radius: 16px; text-decoration: none;
    font-weight: 700; color: #1C1408;
    background: linear-gradient(180deg, #FFF1B5 0%, #E7B743 45%, #B9872A 100%);
    box-shadow: 0 8px 18px -8px rgba(0,0,0,0.8);
  }
  a.store small { display: block; font-weight: 600; opacity: 0.75; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>JP Dominoes Scorekeeper</h1>
  <p id="lead">Keep score at the domino table. Free on iPhone, iPad and Android.</p>
  <a class="store" href="https://apps.apple.com/app/id6817531522"><small id="ios-cap">iPhone &amp; iPad</small>App Store</a>
  <a class="store" href="https://play.google.com/store/apps/details?id=com.bayonne.dominoscorekeeper"><small id="android-cap">Android</small>Google Play</a>
</main>
<script>
  if (/^es\b/i.test(navigator.language || "")) {
    document.documentElement.lang = "es";
    document.getElementById("lead").textContent = "Lleva la cuenta en la mesa de dominó. Gratis en iPhone, iPad y Android.";
  }
</script>
</body>
</html>
